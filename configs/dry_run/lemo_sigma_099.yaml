family: dist_exp
model_class: lemo
batch_size: 32
epochs: 3
lr: 0.001
lr_min: 1.0e-06
scheduler: cosine
patience: 30
weight_decay: 0.001
grad_clip: 1.0
use_residual: false
save_every: 10
num_workers: 0

model:
  width: 48
  n_layers: 3
  kernel_hidden: 64
  activation: relu
  dropout: 0.0
  sigma: 0.99
